[project]
name = "hermes-canvas"
version = "0.1.0"
description = "Hermes plugin: the agent plans on a canvas, the user steers, and box status comes from hooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["desktop", "dashboard/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

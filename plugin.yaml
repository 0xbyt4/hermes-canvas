name: hermes-canvas
version: 0.1.0
description: "Plan on a hand-drawn canvas next to the chat. Boxes are bound to files and check commands, so their status comes from real writes and exit codes, and the user can steer the build from the canvas."
author: "0xbyt4"
license: MIT
requires_hermes: ">=0.22.7"
provides_tools:
  - canvas_draw
  - canvas_update
  - canvas_get
  - canvas_next
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - pre_llm_call
